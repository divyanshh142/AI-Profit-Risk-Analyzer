version: "29.6.2"

services:
  postgres:
    image: ankane/pgvector:latest   # Postgres 16 + pgvector extension pre-installed
    container_name: profit_copilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot_dev_pw   # local dev only — never use in prod
      POSTGRES_DB: profit_copilot
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d   # SQL files here auto-run on first startup

  pgadmin:
    image: dpage/pgadmin4
    container_name: profit_copilot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pg_data:
