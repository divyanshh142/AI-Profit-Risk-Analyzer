spring:
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          options:
            model: models/gemini-flash-latest
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: text-embedding-004
    vectorstore:
      pgvector:
        index-type: NONE
        distance-type: COSINE_DISTANCE
        dimensions: 768
        initialize-schema: true
        table-name: sku_report_embeddings_vs
  datasource:
    url: jdbc:postgresql://localhost:5432/profit_copilot
    username: ${DB_USERNAME:copilot}
    password: ${DB_PASSWORD:copilot_dev_pw}

fastapi:
  base-url: http://localhost:8000

server:
  port: 8080